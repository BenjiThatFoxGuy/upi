name: Build Electron App

on:
  push:
    branches:
      - main
      - electron
  workflow_dispatch:

concurrency:
  group: build-electron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            eb_flag: --mac
            artifact: "*.dmg"
          - os: windows-latest
            eb_flag: --win
            artifact: "*.exe"
          - os: ubuntu-latest
            eb_flag: --linux
            artifact: "*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Python / PyInstaller
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pyinstaller

      - name: Bundle backend with PyInstaller
        shell: bash
        run: |
          cd server
          pyinstaller \
            --onedir \
            --name app \
            --distpath ../electron/pyinstaller-dist \
            --workpath /tmp/upi-pyinstaller-work \
            --noconfirm \
            app.py

      # -----------------------------------------------------------------------
      # Node / Vite frontend
      # -----------------------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build

      # -----------------------------------------------------------------------
      # Electron
      # -----------------------------------------------------------------------
      - name: Install Electron dependencies
        run: |
          cd electron
          npm ci

      - name: Build Electron distributable
        shell: bash
        env:
          # electron-builder reads this to sign/notarise on macOS; skip when unset.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cd electron
          npm run compile
          npx electron-builder ${{ matrix.eb_flag }} --config electron-builder.yml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: upi-desktop-${{ matrix.os }}
          path: dist/electron/${{ matrix.artifact }}
          retention-days: 1
          if-no-files-found: error
