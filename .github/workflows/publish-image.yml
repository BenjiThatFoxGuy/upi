name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # PRs build the image as a status check. Same-repo PRs also push a `pr-<n>`
  # tag and comment the pull command; fork PRs only build (read-only token).
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Docker image
    runs-on: ubuntu-latest
    # Publishing only happens from the public repo; PR builds run anywhere.
    if: github.repository == 'BenjiThatFoxGuy/upi' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
            type=sha,prefix=sha-,enable=${{ github.event_name != 'pull_request' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment pull command on PR
        if: github.event_name == 'pull_request' && env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}:pr-${PR_NUMBER}"
          {
            echo "### 🐳 Docker test image"
            echo
            echo "Built from ${HEAD_SHA}. The tag moves with every push to this PR."
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}"
            echo '```'
            echo
            echo "Image:"
            echo
            echo '```'
            echo "${IMAGE}"
            echo '```'
            if [[ "$PRIVATE_REPO" == "true" ]]; then
              echo
              echo "> The package is private: run \`docker login ghcr.io\` with a token that has \`read:packages\` first."
            fi
          } > "$RUNNER_TEMP/comment.md"
          .github/scripts/upsert-pr-comment.sh upi-docker-image "$RUNNER_TEMP/comment.md"
